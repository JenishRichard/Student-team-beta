server:
  port: 8085

spring:
  application:
    name: api-gateway

  cloud:
    config:
      enabled: false
    gateway:
      server:
        webmvc:
          routes:
            - id: room-service
              uri: http://localhost:8081
              predicates:
                - Path=/rooms, /rooms/**

            - id: booking-service
              uri: http://localhost:8083
              predicates:
                - Path=/bookings, /bookings/**

            - id: auth-service
              uri: http://localhost:8084
              predicates:
                - Path=/auth, /auth/**

jwt:
  secret: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS_123456"