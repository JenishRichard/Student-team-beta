server:
  port: 8085

spring:
  application:
    name: api-gateway
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes:
        - id: rooms
          uri: lb://ROOM-SERVICE
          predicates:
            - Path=/rooms/**
        - id: bookings
          uri: lb://BOOKING-SERVICE
          predicates:
            - Path=/bookings/**
    discovery:
      enabled: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
