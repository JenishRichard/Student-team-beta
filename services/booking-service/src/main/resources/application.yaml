server:
  port: ${SERVER_PORT:8083}

spring:
  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:mysql://${DB_HOST:classroom-dev-db.cvwy4uckycwn.eu-west-1.rds.amazonaws.com}:${DB_PORT:3306}/booking_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_booking_service

management:
  endpoints:
    web:
      exposure:
        include: health,info

resilience4j:
  circuitbreaker:
    instances:
      roomService:
        failure-rate-threshold: 50
        sliding-window-size: 5
        wait-duration-in-open-state: 10s

  retry:
    instances:
      roomService:
        max-attempts: 3
        wait-duration: 2s